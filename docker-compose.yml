services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: opinionapp
      POSTGRES_USER: opinionapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cynthia_local_development_only}
    ports:
      - "5432:5432"
    volumes:
      - opinionapp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opinionapp -d opinionapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  opinionapp-data:
